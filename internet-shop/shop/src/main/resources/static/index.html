<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ShopKZ — Sign In</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-left">
    <div class="auth-logo">🛍️</div>
    <h1 class="auth-title">Shop<span>KZ</span><br/>Store</h1>
    <p class="auth-subtitle">Your modern e-commerce platform. Browse products, place orders, and manage everything in one place.</p>
  </div>
  <div class="auth-right">
    <div class="auth-card">
      <h2>Welcome back</h2>
      <p>Sign in to your account to continue</p>
      <div class="tabs">
        <button class="tab-btn active" onclick="showTab('login',this)">Sign In</button>
        <button class="tab-btn" onclick="showTab('register',this)">Register</button>
      </div>

      <!-- LOGIN -->
      <div id="tab-login" class="tab-content active">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="l-user" placeholder="Enter username"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="l-pass" placeholder="••••••••"/>
        </div>
        <button class="btn btn-primary btn-full" onclick="login()">Sign In</button>
        <p class="demo-hint">Demo: <strong>admin</strong> / <strong>admin123</strong> &nbsp;|&nbsp; <strong>john</strong> / <strong>password123</strong></p>
        <div id="l-err" class="err"></div>
      </div>

      <!-- REGISTER -->
      <div id="tab-register" class="tab-content">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="r-user" placeholder="Choose a username"/>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="r-email" placeholder="your@email.com"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="r-pass" placeholder="Min 6 characters"/>
        </div>
        <button class="btn btn-primary btn-full" onclick="register()">Create Account</button>
        <div id="r-err" class="err"></div>
        <div id="r-suc" class="suc"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
if(getUser()) location.href='products.html';

function showTab(tab,btn){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  btn.classList.add('active');
}

async function login(){
  const username=document.getElementById('l-user').value.trim();
  const password=document.getElementById('l-pass').value;
  const err=document.getElementById('l-err');
  err.textContent='';
  if(!username||!password){err.textContent='Please fill all fields';return;}
  try{
    const users=await get('/users');
    const u=users.find(x=>x.username===username);
    if(!u){err.textContent='User not found';return;}
    saveUser({id:u.id,username:u.username,email:u.email,role:u.role});
    location.href= u.role==='ADMIN' ? 'admin.html' : 'products.html';
  }catch(e){ err.textContent='Connection error. Is the server running?'; }
}

async function register(){
  const username=document.getElementById('r-user').value.trim();
  const email=document.getElementById('r-email').value.trim();
  const password=document.getElementById('r-pass').value;
  const err=document.getElementById('r-err');
  const suc=document.getElementById('r-suc');
  err.textContent=''; suc.textContent='';
  if(!username||!email||!password){err.textContent='Please fill all fields';return;}
  try{
    await post('/users/register',{username,email,password});
    suc.textContent='Account created! You can now sign in.';
    document.getElementById('r-user').value='';
    document.getElementById('r-email').value='';
    document.getElementById('r-pass').value='';
  }catch(e){ err.textContent=e.message||'Registration failed'; }
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(document.getElementById('tab-login').classList.contains('active')) login();
    else register();
  }
});
</script>
</body>
</html>
